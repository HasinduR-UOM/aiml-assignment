# DVC pipeline: `dvc repro` reruns only the stages whose inputs changed.
# Raw downloads (data/raw/*) are tracked with `dvc add`, not produced here,
# because the source websites rate-limit and change over time.
stages:
  parse:
    cmd: python -m src.dcs parse
    deps:
      - data/raw/dcs
      - src/dcs.py
      - src/config.py
    outs:
      - data/interim/paddy_district_long.csv

  features:
    cmd: python -m src.features
    deps:
      - data/interim/paddy_district_long.csv
      - data/raw/weather
      - data/raw/oni
      - src/features.py
    outs:
      - data/processed/model_table.csv

  validate:
    cmd: python -m src.contract
    deps:
      - data/processed/model_table.csv
      - src/contract.py

  train:
    cmd: python -m src.train --n-iter ${train.n_iter}
    deps:
      - data/processed/model_table.csv
      - src/modeling.py
      - src/train.py
      - src/features.py
    params:
      - train.n_iter
    outs:
      - artifacts/models
      - artifacts/app_metadata.json
      - artifacts/train_sample.csv
      - artifacts/test_predictions.csv
    metrics:
      - artifacts/metrics.json:
          cache: false
    plots:
      - artifacts/cv_results.csv:
          cache: false
