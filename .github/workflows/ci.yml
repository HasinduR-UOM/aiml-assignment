# CI: every pull request into main. Lint, unit/contract/scoring tests, and an
# offline schema check of all Azure ML YAML files.
name: CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra serve --extra mlops --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Validate Azure ML YAML
        run: uv run python -m aml.validate
