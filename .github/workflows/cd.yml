# CD: on every push to main, build the API image, push it to GitHub Container
# Registry, deploy it to Azure Container Apps (after a human approves the
# "production" environment), smoke-test it, and promote the model to @champion.
name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  DAGSHUB_OWNER: ${{ vars.DAGSHUB_OWNER }}
  DAGSHUB_REPO: ${{ vars.DAGSHUB_REPO || 'paddy-yield-sl' }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra mlops
      - name: Pull the trained model
        run: |
          make dvc-auth
          uv run dvc pull artifacts/models artifacts/app_metadata.json
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: MODEL_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    needs: build
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy new revision
        run: |
          IMG=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):${{ needs.build.outputs.tag }}
          az extension add -n containerapp --upgrade -y -o none
          az containerapp update -n "${{ vars.AZURE_CONTAINER_APP || 'ca-paddy-yield' }}" \
            -g "${{ vars.AZURE_RESOURCE_GROUP || 'rg-paddy-mlops' }}" \
            --image "$IMG" --set-env-vars MODEL_VERSION=${{ needs.build.outputs.tag }} -o none
      - name: Smoke test /health and /predict
        run: |
          FQDN=$(az containerapp show -n "${{ vars.AZURE_CONTAINER_APP || 'ca-paddy-yield' }}" \
            -g "${{ vars.AZURE_RESOURCE_GROUP || 'rg-paddy-mlops' }}" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 20); do
            if curl -fsS "https://$FQDN/health" | grep -q '${{ needs.build.outputs.tag }}'; then break; fi
            echo "waiting for new revision ($i)"; sleep 15
          done
          curl -fsS "https://$FQDN/health"
          curl -fsS -X POST "https://$FQDN/predict" -H 'Content-Type: application/json' \
            -d '{"district":"Polonnaruwa","season":"Maha"}'
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Promote model to @champion
        if: hashFiles('artifacts/run_info.json') != ''
        run: |
          uv sync --frozen --extra mlops
          uv run python -m src.registry promote
