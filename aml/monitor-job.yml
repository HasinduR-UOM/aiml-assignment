$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
# A one-step pipeline, because Azure ML schedules only run pipeline jobs
type: pipeline
display_name: paddy-yield-drift-check
experiment_name: paddy-yield-monitoring
description: Kolmogorov-Smirnov drift test of the inputs the endpoint received vs the training seasons

settings:
  default_compute: azureml:train-cluster
  default_datastore: azureml:workspaceblobstore

inputs:
  collected:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/modelDataCollector/paddy-yield-ep
  reference:
    type: uri_folder
    path: azureml:paddy-model-table@latest

outputs:
  report:
    type: uri_folder

jobs:
  drift:
    type: command
    display_name: drift check
    code: ../
    environment: azureml:paddy-env@latest
    command: >-
      python -m monitoring.drift_check
      --current ${{inputs.collected}}
      --reference ${{inputs.reference}}
      --out ${{outputs.report}}
    inputs:
      collected: ${{parent.inputs.collected}}
      reference: ${{parent.inputs.reference}}
    outputs:
      report: ${{parent.outputs.report}}
