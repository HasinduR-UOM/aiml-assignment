$schema: https://azuremlschemas.azureedge.net/latest/schedule.schema.json
name: paddy-yield-weekly-drift
display_name: Weekly drift check on endpoint inputs
trigger:
  type: recurrence
  frequency: week
  interval: 1
  schedule:
