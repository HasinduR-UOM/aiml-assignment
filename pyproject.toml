[project]
name = "paddy-yield-sl"
version = "0.2.0"
description = "Pre-harvest district paddy yield forecasting for Sri Lanka, with MLOps"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# explainability + notebooks + Streamlit UI
analysis = ["shap>=0.46", "lime==0.2.0.1", "matplotlib>=3.8", "seaborn>=0.13", "streamlit>=1.50", "jupyter", "ipykernel"]
# MLOps: tracking, data versioning, contracts, serving
# API runtime (the Docker image installs only core + serve)
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# MLOps tooling: tracking/registry (DagsHub MLflow server is 2.x), data versioning, data contract
mlops = ["mlflow>=2.16,<3", "dvc>=3.50", "pandera>=0.20", "httpx>=0.27", "scipy>=1.11"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
